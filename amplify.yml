applications:
  - appRoot: apps/asset-catalog
    frontend:
      buildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci
            build:
              commands:
                - npx ampx generate outputs --branch $AWS_BRANCH --app-id BACKEND_APP_ID
                - npm run build --workspace=apps/asset-catalog
          artifacts:
            baseDirectory: apps/asset-catalog/dist
            files:
              - '**/*'
          cache:
            paths:
              - node_modules/**/*

  - appRoot: apps/portal
